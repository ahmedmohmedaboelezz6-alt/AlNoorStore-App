<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>النور ستور - Al Noor Store</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --success-color: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Navbar Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    header h1 {
      font-size: 24px;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 i {
      color: var(--accent-color);
    }

    .cart-btn {
      background: var(--accent-color);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      transition: all 0.3s;
    }

    .cart-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .cart-count {
      background: #fff;
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 12px;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .product-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #1e293b;
    }

    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .product-price {
      font-size: 20px;
      font-weight: 900;
      color: var(--success-color);
      margin-bottom: 15px;
    }

    .add-to-cart-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: auto;
      transition: all 0.3s;
    }

    .add-to-cart-btn:hover {
      background: var(--accent-hover);
    }

    /* Modal for Checkout / Cart */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <h1><i class="fa-solid fa-store"></i> متجر النور</h1>
      <button class="cart-btn" onclick="openCartModal()">
        <i class="fa-solid fa-cart-shopping"></i> السلة
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </header>

    <!-- Products Grid -->
    <div class="products-grid" id="products-grid">
      <p style="color: var(--text-muted);">جاري تحميل المنتجات...</p>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-cart-shopping"></i> سلة المشتريات</h3>
        <button class="close-btn" onclick="closeCartModal()">&times;</button>
      </div>

      <div id="cart-items-container">
        <!-- Cart Items -->
      </div>

      <div style="margin: 15px 0; font-size: 18px; font-weight: 700; color: var(--success-color);">
        الإجمالي: <span id="cart-total-price">0</span> ج.م
      </div>

      <form id="checkout-form" style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px;">
        <h4 style="margin-bottom: 15px;">بيانات إتمام الطلب</h4>
        <div class="form-group">
          <label>الاسم بالكامل</label>
          <input type="text" id="cust-name" class="form-control" required placeholder="أدخل اسمك الكافي">
        </div>
        <div class="form-group">
          <label>رقم الموبايل</label>
          <input type="tel" id="cust-phone" class="form-control" required placeholder="01xxxxxxxx">
        </div>
        <div class="form-group">
          <label>العنوان التفصيلي</label>
          <input type="text" id="cust-address" class="form-control" required placeholder="المحافظة - المدينة - الشارع">
        </div>

        <button type="submit" class="add-to-cart-btn" style="background: var(--success-color);">
          <i class="fa-solid fa-paper-plane"></i> تأكيد وإرسال الطلب
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // إعدادات Firebase التلقائية المربوطة بالأدمن
    let firebaseConfig = JSON.parse(localStorage.getItem('alnoor_firebase_config')) || {
      apiKey: "AIzaSyDummyKeyForAlNoorApp",
      authDomain: "alnoorstore-app.firebaseapp.com",
      projectId: "alnoorstore-app",
      storageBucket: "alnoorstore-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let cart = [];

    // جلب المنتجات في الوقت الفعلي
    onSnapshot(collection(db, "products"), (snapshot) => {
      const grid = document.getElementById('products-grid');
      if (snapshot.empty) {
        grid.innerHTML = '<p style="color: var(--text-muted);">لا توجد منتجات معروضة حالياً.</p>';
        return;
      }

      grid.innerHTML = '';
      snapshot.docs.forEach(docSnap => {
        const item = docSnap.data();
        grid.innerHTML += `
          <div class="product-card">
            <img src="${item.image || 'https://via.placeholder.com/200'}" class="product-img" alt="${item.name}">
            <div class="product-info">
              <div class="product-title">${item.name}</div>
              <div class="product-price">${item.price} ج.م</div>
              <button class="add-to-cart-btn" onclick="addToCart('${item.name}', ${item.price})">
                <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
              </button>
            </div>
          </div>
        `;
      });
    });

    // إدارة السلة
    window.addToCart = function(name, price) {
      cart.push({ name, price });
      updateCartUI();
      alert(`تم إضافة "${name}" إلى السلة بنجاح!`);
    };

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      const container = document.getElementById('cart-items-container');
      let total = 0;

      container.innerHTML = '';
      if(cart.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">السلة فارغة.</p>';
      } else {
        cart.forEach((item, index) => {
          total += item.price;
          container.innerHTML += `
            <div class="cart-item">
              <div>
                <strong>${item.name}</strong>
                <div style="font-size: 13px; color: var(--success-color);">${item.price} ج.م</div>
              </div>
              <button onclick="removeFromCart(${index})" style="background: none; border: none; color: #ef4444; cursor: pointer;">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          `;
        });
      }

      document.getElementById('cart-total-price').innerText = total;
    }

    window.removeFromCart = function(index) {
      cart.splice(index, 1);
      updateCartUI();
    };

    window.openCartModal = function() {
      document.getElementById('cart-modal').style.display = 'flex';
    };

    window.closeCartModal = function() {
      document.getElementById('cart-modal').style.display = 'none';
    };

    // إرسال الطلب للأدمن
    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (cart.length === 0) {
        alert('السلة فارغة! قم بإضافة منتجات أولاً.');
        return;
      }

      const customerName = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;
      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      try {
        await addDoc(collection(db, "orders"), {
          customerName,
          phone,
          address,
          items: cart,
          totalPrice,
          createdAt: new Date()
        });

        alert('تم إرسال طلبك بنجاح! سنتواصل معك قريباً.');
        cart = [];
        updateCartUI();
        closeCartModal();
        document.getElementById('checkout-form').reset();
      } catch (error) {
        alert('حدث خطأ أثناء إرسال الطلب: ' + error.message);
      }
    });
  </script>
</body>
</html>
