<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر النور</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>🛍️ متجر النور</h1>
    <div id="products-grid" class="grid">جاري تحميل المنتجات...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDsvNr5yJs4jMzAVwqc7g_Kti-_r3ntQa0",
          authDomain: "alnoorstore.firebaseapp.com",
          projectId: "alnoorstore",
          storageBucket: "alnoorstore.firebasestorage.app",
          messagingSenderId: "817663342597",
          appId: "1:817663342597:web:524594c402e7860b9f446c",
          measurementId: "G-07VZE5CQJG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // جلب المنتجات في الوقت الفعلي
        onSnapshot(collection(db, "products"), (snapshot) => {
            const grid = document.getElementById('products-grid');
            if (snapshot.empty) {
                grid.innerHTML = "<p>لا توجد منتجات حالياً</p>";
                return;
            }
            grid.innerHTML = "";
            snapshot.forEach(doc => {
                const item = doc.data();
                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.image || 'https://via.placeholder.com/150'}" alt="${item.name}">
                        <h3>${item.name}</h3>
                        <p>${item.price} جنيه</p>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
